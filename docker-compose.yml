services:
  hunter:
    build: .
    container_name: deal-hunter
    restart: unless-stopped
    env_file: .env
    volumes:
      - hunter-data:/app/data
    ports:
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/healthz')"]
      interval: 60s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  hunter-data:
