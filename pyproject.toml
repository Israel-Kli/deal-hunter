[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deal-hunter"
version = "0.1.0"
description = "Multi-source undervalued for-sale listings monitor for Israeli real estate boards"
requires-python = ">=3.11"
dependencies = [
    "curl_cffi>=0.7",
    "pydantic>=2.6",
    "beautifulsoup4>=4.12",
    "apscheduler>=3.10",
    "requests>=2.31",
    "rapidfuzz>=3.0",
    "google-genai>=1.0",
]

[project.optional-dependencies]
playwright = ["playwright>=1.44"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.4",
]

[project.scripts]
deal-hunter = "deal_hunter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
