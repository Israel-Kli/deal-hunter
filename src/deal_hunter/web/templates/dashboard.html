<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>deal-hunter</title>
<style>
  :root { color-scheme: light; }
  body { font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background:#f5f7fa; color:#1a1a2e; margin:0; padding:20px; }
  h1 { margin:0 0 16px; font-size:20px; }
  .bar { display:flex; gap:12px; align-items:center; margin-bottom:16px; flex-wrap:wrap; }
  input, select { background:#fff; color:#1a1a2e; border:1px solid #d1d5db; border-radius:6px; padding:6px 10px; font-size:14px; }
  table { width:100%; border-collapse:collapse; font-size:13px; background:#fff; border-radius:8px; overflow:hidden; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  th, td { padding:8px 10px; border-bottom:1px solid #e5e7eb; text-align:right; }
  th { background:#e8ecf1; position:sticky; top:0; }
  tr:hover { background:#f0f4ff; }
  .score { display:inline-block; min-width:38px; padding:3px 8px; border-radius:6px; text-align:center; font-weight:600; }
  .s-hot   { background:#22c55e; color:#fff; }
  .s-warm  { background:#f59e0b; color:#fff; }
  .s-cold  { background:#9ca3af; color:#fff; }
  .src     { display:inline-block; padding:2px 8px; border-radius:4px; background:#e5e7eb; font-size:11px; letter-spacing:.5px; text-transform:uppercase; }
  a        { color:#2563eb; text-decoration:none; }
  a:hover  { text-decoration:underline; }
  .muted   { color:#6b7280; font-size:12px; }
  .meta    { margin-bottom:10px; }
</style>
</head>
<body>
  <h1>🏠 deal-hunter</h1>
  <div class="meta muted" id="meta"></div>
  <div class="bar">
    <input id="q" placeholder="חיפוש טקסט..." />
    <select id="src">
      <option value="">כל המקורות</option>
      <option value="yad2">Yad2</option>
      <option value="madlan">Madlan</option>
      <option value="onmap">OnMap</option>
      <option value="ad">ad.co.il</option>
    </select>
    <select id="minScore">
      <option value="0">ציון מכל</option>
      <option value="6">≥ 6</option>
      <option value="7" selected>≥ 7</option>
      <option value="8">≥ 8</option>
      <option value="9">≥ 9</option>
    </select>
    <button onclick="load()">רענן</button>
  </div>
  <table>
    <thead>
      <tr>
        <th>ציון</th>
        <th>מקור</th>
        <th>כתובת</th>
        <th>חדרים</th>
        <th>מ"ר</th>
        <th>מחיר</th>
        <th>₪/מ"ר</th>
        <th>הערכה</th>
        <th>לינק</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
<script>
let all = [];
async function load() {
  const r = await fetch('/api/listings');
  const d = await r.json();
  all = d.listings || [];
  document.getElementById('meta').textContent = `${d.count} listings`;
  render();
}
function scoreClass(s) {
  if (s == null) return 's-cold';
  if (s >= 8) return 's-hot';
  if (s >= 6) return 's-warm';
  return 's-cold';
}
function render() {
  const q = document.getElementById('q').value.trim();
  const src = document.getElementById('src').value;
  const min = parseFloat(document.getElementById('minScore').value);
  const rows = all.filter(l => {
    if (src && l.source !== src) return false;
    if ((l.score ?? 0) < min) return false;
    if (q && !(l.address || '').includes(q) && !(l.neighborhood || '').includes(q)) return false;
    return true;
  }).map(l => `
    <tr>
      <td><span class="score ${scoreClass(l.score)}">${l.score ?? '—'}</span></td>
      <td><span class="src">${l.source}</span></td>
      <td>${l.address || '—'}</td>
      <td>${l.rooms ?? '—'}</td>
      <td>${l.sqm ?? '—'}</td>
      <td>₪${(l.price || 0).toLocaleString()}</td>
      <td>${l.price_per_sqm ? '₪' + l.price_per_sqm.toLocaleString() : '—'}</td>
      <td>${l.fair_price_estimate ? '₪' + l.fair_price_estimate.toLocaleString() : '—'}</td>
      <td><a href="${l.url}" target="_blank">↗</a></td>
    </tr>`).join('');
  document.getElementById('rows').innerHTML = rows || '<tr><td colspan="9" class="muted">אין תוצאות</td></tr>';
}
document.getElementById('q').addEventListener('input', render);
document.getElementById('src').addEventListener('change', render);
document.getElementById('minScore').addEventListener('change', render);
load();
setInterval(load, 30000);
</script>
</body>
</html>
